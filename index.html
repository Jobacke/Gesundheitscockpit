<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gesundheitscockpit</title>
  <meta name="theme-color" content="#16181b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gesundheit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Ladeanzeige -->
  <div id="splash" class="splash">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <p>Gesundheitscockpit</p>
  </div>

  <!-- Anmeldung -->
  <section id="login" class="login" hidden>
    <img src="icons/icon-192.png" alt="" width="84" height="84" class="login-icon">
    <h1>Gesundheitscockpit</h1>
    <p class="muted">Bitte melde dich an.</p>
    <form id="login-form" autocomplete="on">
      <label class="field"><span>E-Mail</span>
        <input type="email" id="login-email" value="backhaus.johannes@gmail.com" autocomplete="username" required></label>
      <label class="field"><span>Passwort</span>
        <input type="password" id="login-pass" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary block">Einmalig für Cloud-Daten anmelden</button>
      <button type="button" id="login-reset" class="btn link block">Passwort vergessen?</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <div id="demo-banner" class="demo-banner" hidden>Demo-Modus – Daten nur auf diesem Gerät</div>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <span id="app-version" class="app-version"></span>
      <button data-tab="heute" class="active">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 8.1a4.3 4.3 0 0 1 7.5 2.7C19.5 16.4 12 21 12 21z"/></svg>
        <span>Heute</span></button>
      <button data-tab="konstanz">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg>
        <span>Konstanz</span></button>
      <button data-tab="verlauf">
        <svg viewBox="0 0 24 24"><path d="M3 20h18M4 16l5-6 4 4 7-9"/></svg>
        <span>Verlauf</span></button>
      <button data-tab="mehr">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Mehr</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
